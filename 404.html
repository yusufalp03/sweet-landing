<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SweetMeet — Sayfa bulunamadı</title>
<meta name="description" content="SweetMeet: ilgi alanlarınla eşleştiğin tanışma uygulaması.">
<style>
  :root { --bg:#131313; --surface:#1e1e1e; --primary:#53E076; --secondary:#FFB1C4; --text:#f2f2f2; --muted:#a5a5a5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card {
    background:var(--surface); border-radius:24px; padding:40px 32px;
    max-width:420px; width:100%; text-align:center;
    box-shadow:0 8px 40px rgba(0,0,0,.5);
  }
  .logo { font-size:56px; line-height:1; }
  h1 { font-size:28px; margin:16px 0 4px; }
  h1 .accent { color:var(--primary); }
  .tagline { color:var(--secondary); font-size:15px; margin-bottom:20px; }
  p.body { color:var(--muted); font-size:15px; line-height:1.6; margin-bottom:28px; }
  .cta {
    display:block; background:var(--primary); color:#0a0a0a; text-decoration:none;
    font-weight:700; font-size:17px; padding:16px; border-radius:999px; margin-bottom:12px;
  }
  .cta.secondary { background:transparent; color:var(--primary); border:1px solid var(--primary); }
  .links { color:var(--muted); font-size:12px; margin-top:20px; }
  .links a { color:var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">💚</div>
  <h1>SweetMeet<span class="accent"></span></h1>
  <div class="tagline">Aradığın sayfa bulunamadı</div>
  <p class="body">
    Bağlantı eski olabilir ya da taşınmış olabilir. Uygulamayı açabilir veya
    ana sayfaya dönebilirsin.
  </p>
  <a class="cta" href="sweet://u/">Uygulamayı aç</a>
  <a class="cta secondary"
     href="https://play.google.com/store/apps/details?id=com.sweet.music">Google Play'den indir</a>
  <div class="links">
    <a href="./">Ana sayfa</a> · <a href="privacy.html">Gizlilik Politikası</a> · <a href="terms.html">Kullanım Koşulları</a>
  </div>
</div>
</body>
</html>
